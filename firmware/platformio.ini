[env:inkplate6color]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DARDUINO_INKPLATECOLOR
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    e-radionicacom/InkplateLibrary@^11.1.2
    bblanchon/ArduinoJson@^7.0.4

; Inkplate 13SPECTRA (13.3" Spectra 6, 1600x1200): ESP32-S3 with 32 MB
; octal flash and octal PSRAM. Soldered's board package doesn't cover it
; for PlatformIO yet, so the S3 devkit board is configured to match. The
; library's 13SPECTRA driver needs arduino-esp32 3.x, hence pioarduino.
[env:inkplate13spectra]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_INKPLATE13SPECTRA
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    e-radionicacom/InkplateLibrary@^11.1.2
    bblanchon/ArduinoJson@^7.0.4

; Panel bring-up without Wi-Fi/server: colour bands + origin marker.
;   pio run -e inkplate13spectra_selftest -t upload
[env:inkplate13spectra_selftest]
extends = env:inkplate13spectra
build_flags =
    ${env:inkplate13spectra.build_flags}
    -DPANEL_SELFTEST

; Pure-logic unit tests run on the host, no hardware needed:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
